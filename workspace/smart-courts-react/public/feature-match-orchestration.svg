<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfeff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cffafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5f3fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06b6d4" stroke-opacity="0.1" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid2)"/>
  
  <!-- Flow diagram boxes -->
  <!-- Vision -->
  <g transform="translate(100, 150)">
    <rect width="140" height="80" rx="12" fill="white" stroke="#06b6d4" stroke-width="2"/>
    <rect x="10" y="15" width="40" height="30" rx="4" fill="url(#iconGrad2)"/>
    <circle cx="30" cy="30" r="8" fill="white"/>
    <text x="60" y="35" font-family="system-ui" font-size="14" font-weight="600" fill="#0f172a">Vision</text>
    <text x="60" y="52" font-family="system-ui" font-size="10" fill="#64748b">AI Detection</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M250 190 L310 190" stroke="url(#flowGrad)" stroke-width="3" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
  </defs>
  
  <!-- Logic -->
  <g transform="translate(330, 150)">
    <rect width="140" height="80" rx="12" fill="white" stroke="#06b6d4" stroke-width="2"/>
    <rect x="10" y="15" width="40" height="30" rx="4" fill="url(#iconGrad2)"/>
    <circle cx="30" cy="25" r="4" fill="white"/>
    <circle cx="22" cy="32" r="3" fill="white"/>
    <circle cx="38" cy="32" r="3" fill="white"/>
    <text x="60" y="35" font-family="system-ui" font-size="14" font-weight="600" fill="#0f172a">Logic</text>
    <text x="60" y="52" font-family="system-ui" font-size="10" fill="#64748b">Rules Engine</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M480 190 L540 190" stroke="url(#flowGrad)" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Output -->
  <g transform="translate(560, 150)">
    <rect width="140" height="80" rx="12" fill="white" stroke="#06b6d4" stroke-width="2"/>
    <rect x="10" y="15" width="40" height="30" rx="4" fill="url(#iconGrad2)"/>
    <rect x="18" y="22" width="24" height="16" rx="2" fill="white"/>
    <text x="60" y="35" font-family="system-ui" font-size="14" font-weight="600" fill="#0f172a">Output</text>
    <text x="60" y="52" font-family="system-ui" font-size="10" fill="#64748b">Scoreboard</text>
  </g>
  
  <!-- Scoreboard display -->
  <g transform="translate(300, 280)">
    <rect width="200" height="100" rx="8" fill="white" stroke="#06b6d4" stroke-width="2"/>
    <rect x="10" y="10" width="80" height="35" rx="4" fill="#ecfeff"/>
    <text x="50" y="33" font-family="system-ui" font-size="20" font-weight="700" fill="#0891b2" text-anchor="middle">15</text>
    <rect x="110" y="10" width="80" height="35" rx="4" fill="#ecfeff"/>
    <text x="150" y="33" font-family="system-ui" font-size="20" font-weight="700" fill="#0891b2" text-anchor="middle">12</text>
    <text x="100" y="70" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">Live Score</text>
    <circle cx="100" cy="85" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating elements -->
  <circle cx="80" cy="80" r="25" fill="#06b6d4" fill-opacity="0.1"/>
  <circle cx="720" cy="370" r="35" fill="#10b981" fill-opacity="0.1"/>
  <circle cx="700" cy="80" r="20" fill="#a855f7" fill-opacity="0.1"/>
  
  <!-- Connection lines -->
  <path d="M400 240 L400 275" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" stroke-opacity="0.5"/>
</svg>
