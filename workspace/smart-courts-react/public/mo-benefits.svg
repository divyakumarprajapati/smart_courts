<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="500" rx="16" fill="#ecfeff"/>
  <rect width="600" height="500" rx="16" fill="url(#mobBgGrad)"/>
  
  <!-- Main scoreboard display -->
  <g transform="translate(150, 60)">
    <rect width="300" height="180" rx="12" fill="white" stroke="#06b6d4" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="300" height="40" rx="12" fill="#cffafe"/>
    <rect y="20" width="300" height="20" fill="#cffafe"/>
    <text x="150" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0891b2" text-anchor="middle">LIVE MATCH</text>
    
    <!-- Score display -->
    <g transform="translate(30, 60)">
      <rect width="100" height="60" rx="8" fill="#ecfeff"/>
      <text x="50" y="25" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Player 1</text>
      <text x="50" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0891b2" text-anchor="middle">21</text>
    </g>
    <text x="150" y="100" font-family="Arial, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">-</text>
    <g transform="translate(170, 60)">
      <rect width="100" height="60" rx="8" fill="#ecfeff"/>
      <text x="50" y="25" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Player 2</text>
      <text x="50" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0891b2" text-anchor="middle">18</text>
    </g>
    
    <!-- Set indicator -->
    <g transform="translate(100, 135)">
      <rect width="100" height="30" rx="6" fill="#06b6d4"/>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Game 2 of 3</text>
    </g>
  </g>
  
  <!-- Benefits cards -->
  <g transform="translate(50, 280)">
    <rect width="150" height="80" rx="8" fill="white" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="30" cy="30" r="15" fill="#cffafe" stroke="#06b6d4" stroke-width="1"/>
    <path d="M23 30 L27 34 L37 24" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <text x="55" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Zero Disputes</text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="9" fill="#64748b">AI decisions are</text>
    <text x="15" y="67" font-family="Arial, sans-serif" font-size="9" fill="#64748b">consistent and fair</text>
  </g>
  
  <g transform="translate(225, 280)">
    <rect width="150" height="80" rx="8" fill="white" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="30" cy="30" r="15" fill="#cffafe" stroke="#06b6d4" stroke-width="1"/>
    <rect x="22" y="22" width="16" height="16" rx="2" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="55" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">No Training</text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Works out of the</text>
    <text x="15" y="67" font-family="Arial, sans-serif" font-size="9" fill="#64748b">box for operators</text>
  </g>
  
  <g transform="translate(400, 280)">
    <rect width="150" height="80" rx="8" fill="white" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="30" cy="30" r="15" fill="#cffafe" stroke="#06b6d4" stroke-width="1"/>
    <rect x="20" y="24" width="20" height="12" rx="2" fill="#06b6d4"/>
    <text x="55" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Multi-Display</text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="9" fill="#64748b">LED, mobile, web</text>
    <text x="15" y="67" font-family="Arial, sans-serif" font-size="9" fill="#64748b">all synchronized</text>
  </g>
  
  <!-- Connected devices -->
  <g transform="translate(80, 390)">
    <rect width="440" height="70" rx="8" fill="white" stroke="#06b6d4" stroke-width="1"/>
    <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Connected Devices</text>
    
    <!-- Device icons -->
    <rect x="60" y="35" width="40" height="25" rx="3" fill="#06b6d4"/>
    <text x="80" y="52" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">LED</text>
    
    <rect x="130" y="35" width="20" height="30" rx="3" fill="#06b6d4"/>
    <rect x="132" y="38" width="16" height="20" rx="2" fill="white"/>
    
    <rect x="180" y="35" width="35" height="25" rx="3" fill="#06b6d4"/>
    <rect x="183" y="38" width="29" height="16" rx="2" fill="white"/>
    
    <rect x="245" y="35" width="50" height="25" rx="3" fill="#06b6d4"/>
    <text x="270" y="52" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">WEB</text>
    
    <rect x="325" y="35" width="50" height="25" rx="3" fill="#06b6d4"/>
    <text x="350" y="52" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">API</text>
  </g>
  
  <!-- Floating decorations -->
  <circle cx="50" cy="50" r="25" fill="#06b6d4" fill-opacity="0.15"/>
  <circle cx="550" cy="450" r="30" fill="#10b981" fill-opacity="0.15"/>
  <circle cx="550" cy="120" r="20" fill="#a855f7" fill-opacity="0.1"/>
  
  <defs>
    <linearGradient id="mobBgGrad" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
  </defs>
</svg>
