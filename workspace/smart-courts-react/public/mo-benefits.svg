<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfeff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cffafe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mobCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" rx="16" fill="url(#mobBg)"/>
  
  <!-- Grid -->
  <pattern id="mobGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#06b6d4" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="600" height="500" fill="url(#mobGrid)"/>
  
  <!-- Main scoreboard display -->
  <g transform="translate(150, 60)">
    <rect width="300" height="180" rx="12" fill="white" stroke="#06b6d4" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="300" height="40" rx="12" fill="#ecfeff"/>
    <rect y="20" width="300" height="20" fill="#ecfeff"/>
    <text x="150" y="28" font-family="system-ui" font-size="14" font-weight="700" fill="#0891b2" text-anchor="middle">LIVE MATCH</text>
    
    <!-- Score display -->
    <g transform="translate(30, 60)">
      <rect width="100" height="60" rx="8" fill="#ecfeff"/>
      <text x="50" y="25" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">Player 1</text>
      <text x="50" y="50" font-family="system-ui" font-size="28" font-weight="800" fill="#0891b2" text-anchor="middle">21</text>
    </g>
    <text x="150" y="100" font-family="system-ui" font-size="20" fill="#64748b" text-anchor="middle">-</text>
    <g transform="translate(170, 60)">
      <rect width="100" height="60" rx="8" fill="#ecfeff"/>
      <text x="50" y="25" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">Player 2</text>
      <text x="50" y="50" font-family="system-ui" font-size="28" font-weight="800" fill="#0891b2" text-anchor="middle">18</text>
    </g>
    
    <!-- Set indicator -->
    <g transform="translate(100, 135)">
      <rect width="100" height="30" rx="6" fill="#06b6d4"/>
      <text x="50" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="white" text-anchor="middle">Game 2 of 3</text>
    </g>
  </g>
  
  <!-- Benefits cards -->
  <g transform="translate(50, 280)">
    <rect width="150" height="80" rx="8" fill="white" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
    <g transform="translate(15, 15)">
      <circle r="15" fill="#ecfeff" stroke="#06b6d4" stroke-width="1"/>
      <path d="M-5 0 L-2 3 L5 -4" stroke="#06b6d4" stroke-width="2" fill="none"/>
    </g>
    <text x="45" y="20" font-family="system-ui" font-size="11" font-weight="600" fill="#0f172a">Zero Disputes</text>
    <text x="15" y="50" font-family="system-ui" font-size="9" fill="#64748b">AI decisions are</text>
    <text x="15" y="62" font-family="system-ui" font-size="9" fill="#64748b">consistent & fair</text>
  </g>
  
  <g transform="translate(225, 280)">
    <rect width="150" height="80" rx="8" fill="white" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
    <g transform="translate(15, 15)">
      <circle r="15" fill="#ecfeff" stroke="#06b6d4" stroke-width="1"/>
      <path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke="#06b6d4" stroke-width="2" fill="none" transform="rotate(45)"/>
    </g>
    <text x="45" y="20" font-family="system-ui" font-size="11" font-weight="600" fill="#0f172a">No Training</text>
    <text x="15" y="50" font-family="system-ui" font-size="9" fill="#64748b">Works out of the</text>
    <text x="15" y="62" font-family="system-ui" font-size="9" fill="#64748b">box for operators</text>
  </g>
  
  <g transform="translate(400, 280)">
    <rect width="150" height="80" rx="8" fill="white" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
    <g transform="translate(15, 15)">
      <circle r="15" fill="#ecfeff" stroke="#06b6d4" stroke-width="1"/>
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="none" stroke="#06b6d4" stroke-width="2"/>
    </g>
    <text x="45" y="20" font-family="system-ui" font-size="11" font-weight="600" fill="#0f172a">Multi-Display</text>
    <text x="15" y="50" font-family="system-ui" font-size="9" fill="#64748b">LED, mobile, web</text>
    <text x="15" y="62" font-family="system-ui" font-size="9" fill="#64748b">all synchronized</text>
  </g>
  
  <!-- Connected devices -->
  <g transform="translate(80, 390)">
    <rect width="440" height="70" rx="8" fill="white" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
    <text x="220" y="25" font-family="system-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Connected Devices</text>
    
    <!-- Device icons -->
    <g transform="translate(60, 35)">
      <rect width="40" height="25" rx="3" fill="#06b6d4"/>
      <text x="20" y="17" font-family="system-ui" font-size="8" fill="white" text-anchor="middle">LED</text>
    </g>
    <g transform="translate(130, 35)">
      <rect width="20" height="30" rx="3" fill="#06b6d4"/>
      <rect x="2" y="3" width="16" height="20" rx="2" fill="white"/>
    </g>
    <g transform="translate(180, 35)">
      <rect width="35" height="25" rx="3" fill="#06b6d4"/>
      <rect x="3" y="3" width="29" height="16" rx="2" fill="white"/>
    </g>
    <g transform="translate(245, 35)">
      <rect width="50" height="25" rx="3" fill="#06b6d4"/>
      <text x="25" y="17" font-family="system-ui" font-size="8" fill="white" text-anchor="middle">WEB</text>
    </g>
    <g transform="translate(325, 35)">
      <rect width="50" height="25" rx="3" fill="#06b6d4"/>
      <text x="25" y="17" font-family="system-ui" font-size="8" fill="white" text-anchor="middle">API</text>
    </g>
  </g>
  
  <!-- Floating decorations -->
  <circle cx="50" cy="50" r="25" fill="#06b6d4" fill-opacity="0.1"/>
  <circle cx="550" cy="450" r="30" fill="#10b981" fill-opacity="0.1"/>
</svg>
