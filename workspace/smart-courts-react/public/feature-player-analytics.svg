<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f3e8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-opacity="0.1" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid3)"/>
  
  <!-- Main dashboard card -->
  <g transform="translate(150, 80)">
    <rect width="500" height="290" rx="16" fill="white" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="500" height="50" rx="16" fill="#faf5ff"/>
    <rect x="0" y="25" width="500" height="25" fill="#faf5ff"/>
    <text x="20" y="32" font-family="system-ui" font-size="16" font-weight="700" fill="#7c3aed">Player Analytics Dashboard</text>
    <circle cx="460" cy="25" r="8" fill="#10b981"/>
    <circle cx="480" cy="25" r="8" fill="#f97316"/>
    
    <!-- Chart area -->
    <g transform="translate(20, 70)">
      <!-- Bar chart -->
      <rect x="0" y="120" width="40" height="80" rx="4" fill="url(#chartGrad)"/>
      <rect x="60" y="80" width="40" height="120" rx="4" fill="url(#chartGrad)"/>
      <rect x="120" y="100" width="40" height="100" rx="4" fill="url(#chartGrad)"/>
      <rect x="180" y="60" width="40" height="140" rx="4" fill="url(#chartGrad)"/>
      <rect x="240" y="90" width="40" height="110" rx="4" fill="url(#chartGrad)"/>
      
      <!-- Axis -->
      <line x1="0" y1="200" x2="300" y2="200" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1"/>
    </g>
    
    <!-- Stats cards -->
    <g transform="translate(340, 70)">
      <rect width="140" height="55" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2"/>
      <text x="15" y="25" font-family="system-ui" font-size="10" fill="#64748b">Avg Speed</text>
      <text x="15" y="42" font-family="system-ui" font-size="18" font-weight="700" fill="#7c3aed">24.5 km/h</text>
    </g>
    <g transform="translate(340, 135)">
      <rect width="140" height="55" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2"/>
      <text x="15" y="25" font-family="system-ui" font-size="10" fill="#64748b">Distance</text>
      <text x="15" y="42" font-family="system-ui" font-size="18" font-weight="700" fill="#7c3aed">3.2 km</text>
    </g>
    <g transform="translate(340, 200)">
      <rect width="140" height="55" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2"/>
      <text x="15" y="25" font-family="system-ui" font-size="10" fill="#64748b">Win Rate</text>
      <text x="15" y="42" font-family="system-ui" font-size="18" font-weight="700" fill="#7c3aed">78%</text>
    </g>
  </g>
  
  <!-- Heatmap mini -->
  <g transform="translate(100, 280)">
    <rect width="80" height="60" rx="6" fill="white" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="25" cy="20" r="12" fill="#a855f7" fill-opacity="0.6"/>
    <circle cx="55" cy="35" r="8" fill="#a855f7" fill-opacity="0.4"/>
    <circle cx="40" cy="45" r="10" fill="#a855f7" fill-opacity="0.5"/>
  </g>
  
  <!-- Trend arrow -->
  <g transform="translate(680, 150)">
    <circle r="30" fill="white" stroke="#10b981" stroke-width="2"/>
    <path d="M-10 8 L0 -10 L10 8" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-5" x2="0" y2="12" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Floating elements -->
  <circle cx="80" cy="100" r="30" fill="#a855f7" fill-opacity="0.1"/>
  <circle cx="720" cy="350" r="40" fill="#06b6d4" fill-opacity="0.1"/>
  <circle cx="720" cy="80" r="25" fill="#10b981" fill-opacity="0.1"/>
</svg>
