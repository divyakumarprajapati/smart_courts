<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e8ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" rx="16" fill="url(#paBg)"/>
  
  <!-- Grid -->
  <pattern id="paGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#a855f7" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="600" height="500" fill="url(#paGrid)"/>
  
  <!-- Dashboard mockup -->
  <g transform="translate(50, 50)">
    <rect width="500" height="320" rx="12" fill="white" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- Header -->
    <rect width="500" height="45" rx="12" fill="#faf5ff"/>
    <rect y="25" width="500" height="20" fill="#faf5ff"/>
    <text x="20" y="30" font-family="system-ui" font-size="14" font-weight="700" fill="#7c3aed">Player Performance Dashboard</text>
    <g transform="translate(420, 12)">
      <circle r="8" fill="#10b981"/>
      <text x="15" y="4" font-family="system-ui" font-size="10" fill="#64748b">Live</text>
    </g>
    
    <!-- Chart area -->
    <g transform="translate(20, 65)">
      <!-- Y axis -->
      <line x1="30" y1="0" x2="30" y2="180" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1"/>
      <!-- X axis -->
      <line x1="30" y1="180" x2="320" y2="180" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1"/>
      
      <!-- Chart line -->
      <path d="M30 150 L80 120 L130 140 L180 80 L230 100 L280 50 L320 70" stroke="#a855f7" stroke-width="3" fill="none"/>
      
      <!-- Area fill -->
      <path d="M30 150 L80 120 L130 140 L180 80 L230 100 L280 50 L320 70 L320 180 L30 180 Z" fill="url(#chartFill)"/>
      
      <!-- Data points -->
      <circle cx="80" cy="120" r="5" fill="#a855f7"/>
      <circle cx="130" cy="140" r="5" fill="#a855f7"/>
      <circle cx="180" cy="80" r="5" fill="#a855f7"/>
      <circle cx="230" cy="100" r="5" fill="#a855f7"/>
      <circle cx="280" cy="50" r="5" fill="#a855f7"/>
      
      <!-- Labels -->
      <text x="175" y="210" font-family="system-ui" font-size="10" fill="#64748b" text-anchor="middle">Performance Over Time</text>
    </g>
    
    <!-- Stats sidebar -->
    <g transform="translate(360, 65)">
      <rect width="120" height="50" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2"/>
      <text x="10" y="20" font-family="system-ui" font-size="9" fill="#64748b">Avg Speed</text>
      <text x="10" y="38" font-family="system-ui" font-size="16" font-weight="700" fill="#7c3aed">24.5 km/h</text>
    </g>
    <g transform="translate(360, 125)">
      <rect width="120" height="50" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2"/>
      <text x="10" y="20" font-family="system-ui" font-size="9" fill="#64748b">Distance</text>
      <text x="10" y="38" font-family="system-ui" font-size="16" font-weight="700" fill="#7c3aed">3.2 km</text>
    </g>
    <g transform="translate(360, 185)">
      <rect width="120" height="50" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2"/>
      <text x="10" y="20" font-family="system-ui" font-size="9" fill="#64748b">Win Rate</text>
      <text x="10" y="38" font-family="system-ui" font-size="16" font-weight="700" fill="#7c3aed">78%</text>
    </g>
    
    <!-- Bottom metrics -->
    <g transform="translate(20, 270)">
      <rect width="110" height="35" rx="4" fill="#faf5ff"/>
      <text x="10" y="15" font-family="system-ui" font-size="9" fill="#64748b">Shots</text>
      <text x="10" y="28" font-family="system-ui" font-size="12" font-weight="600" fill="#7c3aed">156</text>
    </g>
    <g transform="translate(140, 270)">
      <rect width="110" height="35" rx="4" fill="#faf5ff"/>
      <text x="10" y="15" font-family="system-ui" font-size="9" fill="#64748b">Winners</text>
      <text x="10" y="28" font-family="system-ui" font-size="12" font-weight="600" fill="#7c3aed">42</text>
    </g>
    <g transform="translate(260, 270)">
      <rect width="110" height="35" rx="4" fill="#faf5ff"/>
      <text x="10" y="15" font-family="system-ui" font-size="9" fill="#64748b">Errors</text>
      <text x="10" y="28" font-family="system-ui" font-size="12" font-weight="600" fill="#7c3aed">18</text>
    </g>
    <g transform="translate(380, 270)">
      <rect width="100" height="35" rx="4" fill="#faf5ff"/>
      <text x="10" y="15" font-family="system-ui" font-size="9" fill="#64748b">Rallies</text>
      <text x="10" y="28" font-family="system-ui" font-size="12" font-weight="600" fill="#7c3aed">89</text>
    </g>
  </g>
  
  <!-- Feature badges -->
  <g transform="translate(100, 400)">
    <rect width="120" height="35" rx="6" fill="white" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="20" cy="17" r="8" fill="#a855f7"/>
    <text x="35" y="22" font-family="system-ui" font-size="11" font-weight="500" fill="#0f172a">50+ Metrics</text>
  </g>
  <g transform="translate(240, 400)">
    <rect width="120" height="35" rx="6" fill="white" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="20" cy="17" r="8" fill="#10b981"/>
    <text x="35" y="22" font-family="system-ui" font-size="11" font-weight="500" fill="#0f172a">Real-Time</text>
  </g>
  <g transform="translate(380, 400)">
    <rect width="120" height="35" rx="6" fill="white" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="20" cy="17" r="8" fill="#f97316"/>
    <text x="35" y="22" font-family="system-ui" font-size="11" font-weight="500" fill="#0f172a">AI Insights</text>
  </g>
  
  <!-- Floating decorations -->
  <circle cx="550" cy="50" r="25" fill="#a855f7" fill-opacity="0.1"/>
  <circle cx="50" cy="450" r="20" fill="#10b981" fill-opacity="0.1"/>
</svg>
