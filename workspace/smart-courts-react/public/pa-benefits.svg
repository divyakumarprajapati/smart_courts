<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="500" rx="16" fill="url(#pabBgGrad)"/>
  
  <!-- Heatmap visualization -->
  <g transform="translate(50, 60)">
    <rect width="240" height="180" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Court Heatmap</text>
    
    <!-- Court outline -->
    <rect x="20" y="40" width="200" height="120" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <line x1="120" y1="40" x2="120" y2="160" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    
    <!-- Heatmap zones -->
    <circle cx="70" cy="100" r="25" fill="#10b981" fill-opacity="0.6"/>
    <circle cx="70" cy="100" r="15" fill="#10b981" fill-opacity="0.8"/>
    <circle cx="160" cy="130" r="20" fill="#10b981" fill-opacity="0.4"/>
    <circle cx="100" cy="140" r="18" fill="#10b981" fill-opacity="0.5"/>
    <circle cx="180" cy="80" r="15" fill="#10b981" fill-opacity="0.3"/>
  </g>
  
  <!-- Progress comparison -->
  <g transform="translate(310, 60)">
    <rect width="240" height="180" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Progress Tracking</text>
    
    <!-- Speed bars -->
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Speed</text>
    <rect x="20" y="62" width="120" height="12" rx="2" fill="#d1fae5"/>
    <rect x="20" y="62" width="90" height="12" rx="2" fill="#10b981" fill-opacity="0.5"/>
    <rect x="20" y="78" width="120" height="12" rx="2" fill="#10b981"/>
    <text x="150" y="72" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Before</text>
    <text x="150" y="88" font-family="Arial, sans-serif" font-size="9" fill="#10b981" font-weight="bold">After +25%</text>
    
    <!-- Accuracy bars -->
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Accuracy</text>
    <rect x="20" y="122" width="100" height="12" rx="2" fill="#d1fae5"/>
    <rect x="20" y="122" width="75" height="12" rx="2" fill="#10b981" fill-opacity="0.5"/>
    <rect x="20" y="138" width="130" height="12" rx="2" fill="#10b981"/>
    <text x="160" y="132" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Before</text>
    <text x="160" y="148" font-family="Arial, sans-serif" font-size="9" fill="#10b981" font-weight="bold">After +18%</text>
  </g>
  
  <!-- Training recommendations -->
  <g transform="translate(50, 270)">
    <rect width="500" height="100" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">AI Training Recommendations</text>
    
    <circle cx="30" cy="48" r="6" fill="#10b981"/>
    <text x="45" y="52" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">Focus on backhand returns - 23% below average</text>
    
    <circle cx="30" cy="68" r="6" fill="#f97316"/>
    <text x="45" y="72" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">Improve court coverage in rear-left quadrant</text>
    
    <circle cx="30" cy="88" r="6" fill="#06b6d4"/>
    <text x="45" y="92" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">Serve speed is strong - maintain current form</text>
  </g>
  
  <!-- Export options -->
  <g transform="translate(50, 400)">
    <rect width="500" height="60" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Share and Export</text>
    
    <rect x="20" y="32" width="80" height="22" rx="4" fill="#10b981"/>
    <text x="60" y="47" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">PDF Report</text>
    
    <rect x="110" y="32" width="80" height="22" rx="4" fill="#06b6d4"/>
    <text x="150" y="47" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Share Link</text>
    
    <rect x="200" y="32" width="80" height="22" rx="4" fill="#a855f7"/>
    <text x="240" y="47" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">API Access</text>
    
    <rect x="290" y="32" width="80" height="22" rx="4" fill="#f97316"/>
    <text x="330" y="47" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Coach View</text>
  </g>
  
  <!-- Floating decorations -->
  <circle cx="550" cy="50" r="25" fill="#10b981" fill-opacity="0.15"/>
  <circle cx="50" cy="450" r="20" fill="#a855f7" fill-opacity="0.15"/>
  <circle cx="580" cy="250" r="15" fill="#06b6d4" fill-opacity="0.1"/>
  
  <defs>
    <linearGradient id="pabBgGrad" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
</svg>
