<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pabGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" rx="16" fill="url(#pabBg)"/>
  
  <!-- Grid -->
  <pattern id="pabGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="600" height="500" fill="url(#pabGrid)"/>
  
  <!-- Heatmap visualization -->
  <g transform="translate(50, 60)">
    <rect width="240" height="180" rx="12" fill="white" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
    <text x="120" y="25" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Court Heatmap</text>
    
    <!-- Court outline -->
    <rect x="20" y="40" width="200" height="120" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="120" y1="40" x2="120" y2="160" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Heatmap zones -->
    <circle cx="70" cy="80" r="25" fill="#10b981" fill-opacity="0.6"/>
    <circle cx="70" cy="80" r="15" fill="#10b981" fill-opacity="0.8"/>
    <circle cx="160" cy="120" r="20" fill="#10b981" fill-opacity="0.4"/>
    <circle cx="100" cy="130" r="18" fill="#10b981" fill-opacity="0.5"/>
    <circle cx="180" cy="70" r="15" fill="#10b981" fill-opacity="0.3"/>
  </g>
  
  <!-- Progress comparison -->
  <g transform="translate(310, 60)">
    <rect width="240" height="180" rx="12" fill="white" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
    <text x="120" y="25" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Progress Tracking</text>
    
    <!-- Before/After bars -->
    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="system-ui" font-size="10" fill="#64748b">Speed</text>
      <rect y="8" width="80" height="12" rx="2" fill="#d1fae5"/>
      <rect y="8" width="60" height="12" rx="2" fill="#10b981" fill-opacity="0.5"/>
      <rect y="24" width="80" height="12" rx="2" fill="#10b981"/>
      <text x="90" y="18" font-family="system-ui" font-size="9" fill="#64748b">Before</text>
      <text x="90" y="34" font-family="system-ui" font-size="9" fill="#10b981" font-weight="600">After +25%</text>
    </g>
    
    <g transform="translate(20, 100)">
      <text x="0" y="0" font-family="system-ui" font-size="10" fill="#64748b">Accuracy</text>
      <rect y="8" width="70" height="12" rx="2" fill="#d1fae5"/>
      <rect y="8" width="55" height="12" rx="2" fill="#10b981" fill-opacity="0.5"/>
      <rect y="24" width="85" height="12" rx="2" fill="#10b981"/>
      <text x="95" y="18" font-family="system-ui" font-size="9" fill="#64748b">Before</text>
      <text x="95" y="34" font-family="system-ui" font-size="9" fill="#10b981" font-weight="600">After +18%</text>
    </g>
  </g>
  
  <!-- Training recommendations -->
  <g transform="translate(50, 270)">
    <rect width="500" height="100" rx="12" fill="white" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
    <text x="20" y="25" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">AI Training Recommendations</text>
    
    <g transform="translate(20, 40)">
      <circle r="6" fill="#10b981"/>
      <text x="15" y="4" font-family="system-ui" font-size="10" fill="#0f172a">Focus on backhand returns - 23% below average</text>
    </g>
    <g transform="translate(20, 60)">
      <circle r="6" fill="#f97316"/>
      <text x="15" y="4" font-family="system-ui" font-size="10" fill="#0f172a">Improve court coverage in rear-left quadrant</text>
    </g>
    <g transform="translate(20, 80)">
      <circle r="6" fill="#06b6d4"/>
      <text x="15" y="4" font-family="system-ui" font-size="10" fill="#0f172a">Serve speed is strong - maintain current form</text>
    </g>
  </g>
  
  <!-- Export options -->
  <g transform="translate(50, 400)">
    <rect width="500" height="60" rx="12" fill="white" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
    <text x="20" y="25" font-family="system-ui" font-size="11" font-weight="600" fill="#0f172a">Share & Export</text>
    
    <g transform="translate(20, 35)">
      <rect width="80" height="20" rx="4" fill="#10b981"/>
      <text x="40" y="14" font-family="system-ui" font-size="9" fill="white" text-anchor="middle">PDF Report</text>
    </g>
    <g transform="translate(110, 35)">
      <rect width="80" height="20" rx="4" fill="#06b6d4"/>
      <text x="40" y="14" font-family="system-ui" font-size="9" fill="white" text-anchor="middle">Share Link</text>
    </g>
    <g transform="translate(200, 35)">
      <rect width="80" height="20" rx="4" fill="#a855f7"/>
      <text x="40" y="14" font-family="system-ui" font-size="9" fill="white" text-anchor="middle">API Access</text>
    </g>
    <g transform="translate(290, 35)">
      <rect width="80" height="20" rx="4" fill="#f97316"/>
      <text x="40" y="14" font-family="system-ui" font-size="9" fill="white" text-anchor="middle">Coach View</text>
    </g>
  </g>
  
  <!-- Floating decorations -->
  <circle cx="550" cy="50" r="25" fill="#10b981" fill-opacity="0.1"/>
  <circle cx="50" cy="50" r="20" fill="#a855f7" fill-opacity="0.1"/>
</svg>
